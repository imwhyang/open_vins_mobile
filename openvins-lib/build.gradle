plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

// 与 GitHub/JitPack 发布标签对应；Android 元信息不带 v，Maven 坐标沿用 v 前缀。
def openVinsReleaseVersion = '1.0.29'

android {
    namespace "com.openvins.android"
    compileSdk 30
//    ndkVersion "21.0.6113669"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 1
        versionName openVinsReleaseVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11 -frtti -fexceptions"
                abiFilters 'arm64-v8a'
                arguments "-DOpenCV_DIR=" + project(':thirdparty:opencv').projectDir.absolutePath + "/native",
                        "-DBOOST_DIR=" + project(':thirdparty:boost').projectDir.absolutePath,
                        "-DEIGEN3_DIR=" + project(':thirdparty:eigen3').projectDir.absolutePath,
                        "-DANDROID_ARM_NEON=ON"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    sourceSets {
        main {
            jniLibs.srcDirs += [project(':thirdparty:boost').projectDir.absolutePath + '/libs']
        }
    }
}

dependencies {
    // 真机验证外部相机的 I420/NV21 转换，避免仅编译通过却在首帧出现 native 异常。
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation "io.github.kotlin-graphics:glm:0.9.9.1-12"

    // OpenCV 本地子模块依赖，编译和运行时均需要；
    // 在 POM 发布时会被手动移除，消费方不需单独添加
    implementation project(':thirdparty:opencv')
}

// Maven Publish 配置，供 JitPack 使用
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                // 本地发布与 JitPack 使用同一正式坐标，避免消费者依赖临时 USB 包。
                groupId = 'com.github.imwhyang'
                artifactId = 'open_vins_mobile'
                version = "v${openVinsReleaseVersion}"

                // 移除本地子模块依赖，防止消费方编译失败
                pom.withXml {
                    def depsNode = asNode().get('dependencies')
                    if (depsNode && depsNode.size() > 0) {
                        def toRemove = depsNode[0].children().findAll { node ->
                            node.get('groupId').text().startsWith('open_vins_android')
                        }
                        toRemove.each { depsNode[0].remove(it) }
                    }
                }
            }
        }
    }
}
