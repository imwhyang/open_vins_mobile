plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

android {
    namespace "com.openvins.android"
    compileSdk 30
    ndkVersion "21.0.6113669"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11 -frtti -fexceptions"
                abiFilters 'arm64-v8a'
                arguments "-DOpenCV_DIR=" + project(':thirdparty:opencv').projectDir.absolutePath + "/native",
                        "-DBOOST_DIR=" + project(':thirdparty:boost').projectDir.absolutePath,
                        "-DEIGEN3_DIR=" + project(':thirdparty:eigen3').projectDir.absolutePath,
                        "-DANDROID_ARM_NEON=ON",
                        "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation project(':thirdparty:opencv')
}

// JitPack / Maven 发布配置
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.imwhyang.open_vins_mobile'
                artifactId = 'openvins-lib'
                version = '1.0.0'

                pom {
                    name = 'OpenVINS Mobile Library'
                    description = 'Android VIO (Visual-Inertial Odometry) library based on OpenVINS'
                    url = 'https://github.com/imwhyang/open_vins_mobile'
                    licenses {
                        license {
                            name = 'GNU General Public License v3.0'
                            url = 'https://www.gnu.org/licenses/gpl-3.0.en.html'
                        }
                    }
                    developers {
                        developer {
                            id = 'imwhyang'
                            name = 'Wenhai Yang'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/imwhyang/open_vins_mobile.git'
                        developerConnection = 'scm:git:ssh://github.com/imwhyang/open_vins_mobile.git'
                        url = 'https://github.com/imwhyang/open_vins_mobile'
                    }
                }
            }
        }
    }
}
